//file:noinspection SpellCheckingInspection
plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    defaultConfig {
        applicationId "sh.siava.AOSPMods"
        minSdk 33
        targetSdk 36
        versionCode 245
        versionName "canary-245"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = new File("AOSPMods.apk")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    namespace 'sh.siava.AOSPMods'
    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def libsuVersion = '5.0.5'

    //Xposed api
    compileOnly files('lib/api-82.jar')
    compileOnly files('lib/api-82-sources.jar')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'com.google.android.material:material:1.9.0'

    // The core module that provides APIs to a shell
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"

    // Remote Preferences for Xposed Module prefs
    implementation 'com.crossbowffs.remotepreferences:remotepreferences:0.8'

}